name: Refresh mysql2 lockfile

on:
  push:
    branches:
      - security/mysql2-ghsa-3f6p-5ww8-9rcr

permissions:
  contents: write

jobs:
  refresh-lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/mysql2-ghsa-3f6p-5ww8-9rcr
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Regenerate lockfile for patched mysql2
        run: npm install --package-lock-only --ignore-scripts 'mysql2@^3.22.0'
      - name: Commit regenerated lockfile
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo 'Lockfile already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          git commit -m 'security: regenerate lockfile for mysql2 3.x'
          git push origin HEAD:security/mysql2-ghsa-3f6p-5ww8-9rcr
